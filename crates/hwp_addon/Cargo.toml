[package]
name = "hwp_addon"
version = "0.4.0"
authors = [ "sephiron <sephiron@hanmail.net>" ]
license = "MIT"
edition = "2024"
description = "Unofficial framework for writing Hancom HWP (Hangul Word Processor) add-on DLLs (user actions, toolbar, shortcuts) in Rust"
repository = "https://github.com/sephiron99/hwp_automation_rs"
readme = "../../README.md"
keywords = ["hwp", "hangul", "hancom", "addon", "plugin"]
categories = ["api-bindings", "os::windows-apis"]

# 1. 라이브러리 타입 설정 (가장 중요)
# [lib]
# name = "hwp_addon"
# C/C++ 호환 표준 Windows DLL로 빌드
# crate-type = ["cdylib"]

[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]
# 버전 feature로 감싼 API도 문서에 나오게 하고, "Available on crate feature ..." 배지를 붙인다.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "2.0.20"
# 2. 문자열 처리 (COM BSTR <-> Rust String 변환용)
widestring = "1.2.1"
hwp_core = { version = "0.4.0", path = "../hwp_core" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "chrono"], optional = true }

# 3. Windows API 바인딩 (Microsoft 공식 크레이트)
[dependencies.windows]
# version = ">=0.59, <=0.62"
version = "0.62.2" # 최신 안정화 버전 기준
features = [
    # COM 인터페이스 구현을 위한 매크로
    # "implement", 

    # 필수 기본 타입 (HRESULT, BSTR, HWND, BOOL 등)
    "Win32_Foundation", 

    # COM 코어 시스템 (IUnknown, IClassFactory, CoTaskMemAlloc 등)
    "Win32_System_Com", 

    # OLE 자동화 핵심 (IDispatch, VARIANT, SAFEARRAY 등 - HWP 파라미터 제어에 필수)
    "Win32_System_Ole", 

    # 레지스트리 조작 (DllRegisterServer 구현 시 HWP 추가기능 등록에 필요)
    "Win32_System_Registry", 

    # 모듈 정보 획득 (DLL 자체의 경로를 찾을 때 필요)
    "Win32_System_LibraryLoader",
    # "Win32_Foundation",           # 기본 타입 (BSTR, HRESULT, BOOL, HWND 등)
    # "Win32_System_Com",           # COM 코어 (IClassFactory, CoInitialize 등)
    # "Win32_System_Ole",           # OLE 코어 (IDispatch, DISPPARAMS 등)
    "Win32_System_Variant",       # VARIANT 구조체 (0.5x 이상부터 명시적 추가 권장)
    # "Win32_System_Registry",      # 레지스트리 조작 (옵션 - winreg 사용 시 제거 가능)
    "Win32_System_LibraryLoader", # DLL 경로 탐색 (GetModuleFileNameW)
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_TextServices",
]

[features]
# 파일 로그 구독자(`hwp_addon::logging`). 켜지 않으면 로그는 어디에도 기록되지 않는다.
file-log = ["dep:tracing-subscriber"]
# 최소 대상 한글 버전. hwp_core의 같은 이름 feature를 켠다. 기본은 한글 2018.
v2022 = ["hwp_core/v2022"]
v2024 = ["v2022", "hwp_core/v2024"]
